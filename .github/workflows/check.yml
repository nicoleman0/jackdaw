name: Check CSS
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes lightningcss-cli@1.30.2 --bundle index.css -o /tmp/jackdaw.css
      - run: npm pack --dry-run
      - run: python3 scripts/build-catalogue.py && git diff --exit-code -- catalogue.html
      - run: node tests/catalogue.cjs
